# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# =============================================================================
# GITHUB ACTIONS WORKFLOW FOR PS.Tweak.Tools RELEASES
# =============================================================================
# Trigger options:
#   1. Automatically when a tag starting with "pstt-" is pushed
#      (e.g. pstt-v1.00.00, pstt-v2.05.01)
#   2. Manually via the GitHub Actions UI (workflow_dispatch) with custom inputs
#
# Version source of truth:
#   .github/workflows/pstt-version.txt
#   The workflow reads the version from this file first.
#   If the file is missing it falls back to deriving the version from the tag.
#
# Release body template:
#   .github/workflows/pstt-release.md
#   The workflow reads this Markdown file and replaces all {{PLACEHOLDER}}
#   tokens at runtime before passing the content to the release action.
#
# IMPORTANT - PS.Tweak.Tools is a building block of the WinTwin.Fusion
# Framework, NOT a standalone module. It only works inside an existing
# WinTwin.Fusion installation. The ZIP built by this workflow is therefore
# NOT meant for standalone use - its only purpose is to let advanced users
# apply an UNOFFICIAL, early update of this component inside an existing
# WinTwin.Fusion installation, ahead of the official merge/release through
# the WinTwin.Fusion repository (see the cross-repo sync section below).
# Standalone WinTwin.Fusion tools (e.g. WTF.Console) get their own dedicated
# repository and their own release pipeline - this notice does not apply
# to them.
#
# Cross-repo release synchronization:
#   After the GitHub Release has been published, this workflow is the
#   TRIGGERING side of a cross-repo release-sync pipeline. It fires a
#   `repository_dispatch` event of type "pstt-release" against the
#   WinTwin-Fusion/WinTwin.Fusion repository. That repository owns a
#   companion workflow (sync-pstt-release.yml) which reacts to the event by
#   creating a new branch and committing the updated PS.Tweak.Tools module
#   files into its ".\PS.Tweak.Tools" subdirectory. This is the OFFICIAL
#   update path - the sync branch is reviewed and merged manually.
#
# Required repository secret:
#   CROSS_REPO_SYNC_TOKEN
#     A GitHub Personal Access Token (classic, scope "repo", or a
#     fine-grained token with "Contents: write" + "Actions: write" on
#     WinTwin-Fusion/WinTwin.Fusion). The default GITHUB_TOKEN can NOT be
#     used here because it is not permitted to trigger workflows in a
#     different repository.
# =============================================================================

name: PS.Tweak.Tools Release

env:
  zip_basename:    "PS.Tweak.Tools"
  module_folder:   "PS.Tweak.Tools"
  temp_folder:     "PS.Tweak.Tools-Module"
  workflow_file:   "pstt-release.yml"
  version_file:    ".github/workflows/pstt-version.txt"
  release_md:      ".github/workflows/pstt-release.md"
  sync_repo:        "WinTwin-Fusion/WinTwin.Fusion"
  sync_event_type:  "pstt-release"

on:
  push:
    tags:
      - 'pstt-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., pstt-v1.00.00)'
        required: true
        default: 'pstt-v1.00.00'
        type: string
      create_tag:
        description: 'Create the tag if it does not exist yet'
        required: true
        default: true
        type: boolean
      unofficial_release:
        description: 'Mark as Unofficial Release (for testing / debugging only)'
        required: true
        default: false
        type: boolean
      release_notes:
        description: 'Additional release notes (optional, Markdown supported)'
        required: false
        default: ''
        type: string
      trigger_sync:
        description: 'Trigger cross-repo sync into WinTwin.Fusion after publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions:  write

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pstt-')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and build dynamic variables
        id: setup
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            echo "Manual trigger detected"
          else
            TAG_NAME="${{ github.ref_name }}"
            echo "Automatic tag trigger detected"
          fi
          echo "Tag: $TAG_NAME"
          if [[ ! $TAG_NAME =~ ^pstt-.*$ ]]; then
            echo "ERROR: Tag must start with 'pstt-' - provided: $TAG_NAME"
            exit 1
          fi
          VERSION_FILE="${{ env.version_file }}"
          if [ -f "$VERSION_FILE" ]; then
            VERSION=$(cat "$VERSION_FILE" | tr -d '[:space:]')
            echo "Version from $VERSION_FILE: $VERSION"
          else
            VERSION="${TAG_NAME#pstt-}"
            echo "WARNING: version file not found - derived from tag: $VERSION"
          fi
          UNOFFICIAL="${{ github.event.inputs.unofficial_release }}"
          if [ -z "$UNOFFICIAL" ]; then UNOFFICIAL="false"; fi
          TRIGGER_SYNC="${{ github.event.inputs.trigger_sync }}"
          if [ -z "$TRIGGER_SYNC" ]; then TRIGGER_SYNC="true"; fi
          if [ "$UNOFFICIAL" = "true" ]; then
            FULL_ZIP="${{ env.zip_basename }}-${VERSION}-UNOFFICIAL.zip"
            RELEASE_TITLE="UNOFFICIAL - PS.Tweak.Tools $TAG_NAME"
          else
            FULL_ZIP="${{ env.zip_basename }}-${VERSION}-Release.zip"
            RELEASE_TITLE="PS.Tweak.Tools $TAG_NAME"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "zip_filename=$FULL_ZIP" >> $GITHUB_OUTPUT
          echo "unofficial=$UNOFFICIAL" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "trigger_sync=$TRIGGER_SYNC" >> $GITHUB_OUTPUT

      - name: Create tag if requested
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.create_tag == 'true'
        run: |
          TAG_NAME="${{ steps.setup.outputs.tag_name }}"
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag '$TAG_NAME' already exists - continuing"
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Build release body from template
        id: build_body
        run: |
          OUTPUT="release-body.md"
          if [ ! -f "${{ env.release_md }}" ]; then
            echo "ERROR: template not found: ${{ env.release_md }}"
            exit 1
          fi
          if [ "${{ steps.setup.outputs.unofficial }}" = "true" ]; then
            UNOFFICIAL_BANNER=$(printf '> [!CAUTION]\n> ### UNOFFICIAL RELEASE - FOR TESTING AND DEBUGGING PURPOSES ONLY\n> This release has **NOT** been officially approved. It must **NOT** be used in production environments. Use at your own risk.\n')
          else
            UNOFFICIAL_BANNER=""
          fi
          RAW_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -n "$RAW_NOTES" ]; then
            RELEASE_NOTES_VAL="$RAW_NOTES"
          else
            RELEASE_NOTES_VAL="_No additional notes provided for this release._"
          fi
          if [ "${{ steps.setup.outputs.trigger_sync }}" = "true" ]; then
            SYNC_STATUS_VAL=$(printf 'This release automatically triggers a synchronization branch in [`${{ env.sync_repo }}`](https://github.com/${{ env.sync_repo }}), updating the `.\\PS.Tweak.Tools\\` directory with the module files of this release.\n')
          else
            SYNC_STATUS_VAL="Cross-repo synchronization was disabled for this release run."
          fi
          cat > /tmp/render_template.py << 'PYEOF'
          import os
          template_path = os.environ['TMPL']
          output_path   = os.environ['OUT']
          replacements  = {
              '{{LOGO_URL}}':          os.environ['LOGO_URL'],
              '{{ZIP_FILENAME}}':      os.environ['ZIP_FILENAME'],
              '{{DOWNLOAD_URL}}':      os.environ['DOWNLOAD_URL'],
              '{{REPO_URL}}':          os.environ['REPO_URL'],
              '{{VERSION}}':           os.environ['VERSION'],
              '{{UNOFFICIAL_BANNER}}': os.environ['UNOFFICIAL_BANNER'],
              '{{RELEASE_NOTES}}':     os.environ['RELEASE_NOTES'],
              '{{SYNC_STATUS}}':       os.environ['SYNC_STATUS'],
          }
          with open(template_path, 'r', encoding='utf-8') as f:
              body = f.read()
          for placeholder, value in replacements.items():
              body = body.replace(placeholder, value)
          with open(output_path, 'w', encoding='utf-8') as f:
              f.write(body)
          PYEOF
          TMPL="${{ env.release_md }}" \
          OUT="$OUTPUT" \
          LOGO_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/Ressources/PS.Tweak.Tools.Logo.png" \
          ZIP_FILENAME="${{ steps.setup.outputs.zip_filename }}" \
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.setup.outputs.tag_name }}/${{ steps.setup.outputs.zip_filename }}" \
          REPO_URL="https://github.com/${{ github.repository }}" \
          VERSION="${{ steps.setup.outputs.version }}" \
          UNOFFICIAL_BANNER="$UNOFFICIAL_BANNER" \
          RELEASE_NOTES="$RELEASE_NOTES_VAL" \
          SYNC_STATUS="$SYNC_STATUS_VAL" \
          python3 /tmp/render_template.py
          echo "body_file=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Create PS.Tweak.Tools unofficial update package
        run: |
          ZIP_FILENAME="${{ steps.setup.outputs.zip_filename }}"
          DEST="release-temp/${{ env.temp_folder }}"
          mkdir -p "$DEST"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='release-temp' \
            --exclude="${ZIP_FILENAME}" \
            ./ "$DEST/"
          cd release-temp
          zip -r "../${ZIP_FILENAME}" "${{ env.temp_folder }}/"
          cd ..
          ls -lh "${ZIP_FILENAME}"
          unzip -l "${ZIP_FILENAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name:  ${{ steps.setup.outputs.tag_name }}
          name:      ${{ steps.setup.outputs.release_title }}
          body_path: ${{ steps.build_body.outputs.body_file }}
          files:     ${{ steps.setup.outputs.zip_filename }}
          draft:      false
          prerelease: ${{ steps.setup.outputs.unofficial == 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger cross-repo sync in WinTwin.Fusion
        if: steps.setup.outputs.trigger_sync == 'true'
        env:
          CROSS_REPO_SYNC_TOKEN: ${{ secrets.CROSS_REPO_SYNC_TOKEN }}
        run: |
          if [ -z "$CROSS_REPO_SYNC_TOKEN" ]; then
            echo "ERROR: Secret CROSS_REPO_SYNC_TOKEN is not set."
            exit 1
          fi
          TAG_NAME="${{ steps.setup.outputs.tag_name }}"
          VERSION="${{ steps.setup.outputs.version }}"
          ZIP_FILENAME="${{ steps.setup.outputs.zip_filename }}"
          COMMIT_SHA="${{ github.sha }}"
          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CROSS_REPO_SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ env.sync_repo }}/dispatches" \
            -d "{\"event_type\": \"${{ env.sync_event_type }}\", \"client_payload\": {\"source_repo\": \"${{ github.repository }}\", \"tag_name\": \"${TAG_NAME}\", \"version\": \"${VERSION}\", \"zip_filename\": \"${ZIP_FILENAME}\", \"commit_sha\": \"${COMMIT_SHA}\", \"unofficial\": \"${{ steps.setup.outputs.unofficial }}\", \"actor\": \"${{ github.actor }}\"}}")
          echo "GitHub API response status: $HTTP_STATUS"
          cat /tmp/dispatch_response.json || true
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Cross-repo sync event dispatched successfully."
          else
            echo "ERROR: Failed to dispatch cross-repo sync event (HTTP $HTTP_STATUS)."
            exit 1
          fi

      - name: Print release summary
        run: |
          TAG_NAME="${{ steps.setup.outputs.tag_name }}"
          ZIP_FILENAME="${{ steps.setup.outputs.zip_filename }}"
          echo "======================================================"
          echo " ${{ github.workflow }} - Release Summary"
          echo "======================================================"
          echo "  Repository : ${{ github.repository }}"
          echo "  Tag        : $TAG_NAME"
          echo "  Version    : ${{ steps.setup.outputs.version }}"
          echo "  ZIP        : $ZIP_FILENAME"
          echo "  Title      : ${{ steps.setup.outputs.release_title }}"
          echo "  Trigger    : ${{ github.event_name }}"
          echo "  Unofficial : ${{ steps.setup.outputs.unofficial }}"
          echo "  Commit SHA : ${{ github.sha }}"
          echo "  Timestamp  : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "------------------------------------------------------"
          echo "  Release Page : https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
          echo "  Download URL : https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/$ZIP_FILENAME"
          echo "------------------------------------------------------"
          echo "  Cross-Repo Sync Target : ${{ env.sync_repo }}"
          echo "  Sync Triggered         : ${{ steps.setup.outputs.trigger_sync }}"
          echo "------------------------------------------------------"
          echo "  Workflow : https://github.com/${{ github.repository }}/actions/workflows/${{ env.workflow_file }}"
          echo "======================================================"
